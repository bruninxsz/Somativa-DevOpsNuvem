spring.application.name=exercicio01

# Porta: o Railway injeta a variavel PORT; localmente usa 8080
server.port=${PORT:8080}

# Banco em memoria H2
spring.datasource.url=jdbc:h2:mem:maquinas;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
